name: 🚀 Web Hosting FTP Otomatik Deploy (CI/CD)

on:
  push:
    branches:
      - main
      - master

jobs:
  web-deploy:
    name: 📦 Derle ve FTP ile Canlıya Al
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Depoyu Klonla (Checkout)
        uses: actions/checkout@v4

      - name: ⚙️ Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Bağımlılıkları Yükle
        run: npm ci

      - name: 🔨 Projeyi Derle (Vite Build)
        run: npm run build

      - name: 🚀 FTP İle Sunucuya Yükle (Deploy to Web Server)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/pdks/' }}
          protocol: 'ftp'
          security: 'loose'
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            .gitignore
            tsconfig*.json
            vite.config.ts
            package*.json
            README.md
